<style>
/* =========================================================
   TOKENS — shared with index.html / repapp.html /
   hospital-wayfinding.html / red-thread.html. Single source
   of truth is :root on the board; mirror any board change here.
   ========================================================= */
:root{
  --surface:      #F3F0EA;
  --paper:        #FCFBF8;
  --paper-warm:   #F7F4EE;

  --ink:          #1A1917;
  --ink-soft:     #4A463F;
  --ink-mute:     #8E887C;
  --hair:         #E0DACE;

  --accent:       #7A6BA8;
  --accent-tint:  #E4DDF1;

  --sh-rest:
      0 1px 1.5px  rgba(58,50,38,.05),
      0 4px 8px   -3px rgba(58,50,38,.07),
      0 14px 30px -12px rgba(58,50,38,.13);
  --sh-card:
      0 1px 2px    rgba(58,50,38,.05),
      0 10px 24px -10px rgba(58,50,38,.14),
      0 30px 60px -30px rgba(58,50,38,.20);

  --ease:   cubic-bezier(.22,.61,.36,1);
  --settle: cubic-bezier(.16,.84,.44,1);

  --font-display:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --font-ui:'Inter',ui-sans-serif,-apple-system,'Segoe UI',sans-serif;

  --side-w: 250px;
  --read:   680px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:var(--surface);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28;
  background-image:radial-gradient(rgba(120,105,80,.15) .5px,transparent .5px);
  background-size:3px 3px;
}

#progress{
  position:fixed;left:0;top:0;height:2px;width:100%;transform:scaleX(0);
  transform-origin:0 50%;background:var(--accent);opacity:.85;z-index:970;
  transition:transform .1s linear;
}

#lang{
  position:fixed;top:24px;right:24px;z-index:960;
  display:flex;gap:2px;padding:4px;border-radius:22px;
  background:var(--paper);box-shadow:var(--sh-rest);
}
#lang::before{
  content:'';position:absolute;left:4px;top:4px;
  width:calc(50% - 4px);height:calc(100% - 8px);
  background:var(--accent);border-radius:18px;
  transition:transform .3s var(--ease);
}
#lang[data-l="no"]::before{transform:translateX(100%);}
#lang button{
  position:relative;z-index:1;border:0;background:none;cursor:pointer;
  font-family:var(--font-ui);font-size:10.5px;font-weight:500;
  letter-spacing:.13em;padding:6px 13px;border-radius:18px;
  color:var(--ink-mute);transition:color .3s var(--ease);
}
#lang button[aria-pressed="true"]{color:var(--paper);}
#lang button:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px;}

.side{
  position:fixed;left:0;top:0;width:var(--side-w);height:100vh;z-index:5;
  padding:38px 30px 36px;
  display:flex;flex-direction:column;gap:30px;
  border-right:1px solid var(--hair);
  background:linear-gradient(180deg, rgba(247,244,238,.6), rgba(243,240,234,.6));
}
.back{
  display:inline-flex;align-items:center;gap:8px;width:fit-content;
  font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-mute);text-decoration:none;transition:color .3s var(--ease);
}
.back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease);}
.back:hover{color:var(--accent);}
.back:hover svg{transform:translateX(-3px);}

.mark{line-height:1.2;}
.mark .nm{font-family:var(--font-display);font-size:26px;color:var(--ink);}
.mark .sub{margin-top:4px;font-size:11px;letter-spacing:.05em;color:var(--ink-mute);}

.toc{margin-top:2px;overflow-y:auto;flex:1;}
.toc ol{list-style:none;display:flex;flex-direction:column;gap:2px;}
.toc a{
  display:flex;gap:10px;align-items:baseline;
  padding:5px 0;text-decoration:none;
  font-size:12.5px;color:var(--ink-mute);
  transition:color .25s var(--ease);
}
.toc a .n{font-size:9.5px;letter-spacing:.05em;color:var(--ink-mute);opacity:.6;
  min-width:15px;font-variant-numeric:tabular-nums;transition:color .25s;}
.toc a:hover{color:var(--ink-soft);}
.toc a.on{color:var(--accent);}
.toc a.on .n{color:var(--accent);opacity:1;}

.main{position:relative;z-index:1;margin-left:var(--side-w);padding:0 6vw 12vh;}
.col{max-width:var(--read);margin:0 auto;}
.wide{max-width:920px;margin-left:auto;margin-right:auto;}

header.head{padding:14vh 0 0;}
.kicker{
  font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:20px;
}
h1.title{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(52px,8vw,104px);line-height:.94;letter-spacing:-.02em;color:var(--ink);
}
.dek{
  margin-top:24px;max-width:34ch;
  font-family:var(--font-display);font-size:clamp(21px,2.4vw,27px);
  line-height:1.28;color:var(--ink-soft);
}
.meta{
  margin-top:40px;padding-top:26px;border-top:1px solid var(--hair);
  display:flex;flex-wrap:wrap;gap:34px 44px;
}
.meta .m{display:flex;flex-direction:column;gap:6px;}
.meta .m .k{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);}
.meta .m .v{font-size:14px;color:var(--ink-soft);}

section.sec{padding:9vh 0 0;scroll-margin-top:40px;}
.eyebrow{
  font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:18px;
}
.eyebrow b{color:var(--accent);font-weight:500;}
h2.h{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(30px,4vw,48px);line-height:1.04;letter-spacing:-.012em;color:var(--ink);
  max-width:20ch;
}
.sec p{margin-top:22px;font-size:17px;line-height:1.62;color:var(--ink-soft);}
.sec p:first-of-type{margin-top:26px;}
.sec p strong{color:var(--ink);font-weight:500;}
h3.sh{
  margin-top:38px;font-family:var(--font-display);font-weight:400;
  font-size:clamp(22px,2.6vw,28px);line-height:1.1;color:var(--ink);
}

ul.pts,ol.steps{margin-top:26px;display:flex;flex-direction:column;gap:2px;list-style:none;}
ul.pts li,ol.steps li{
  position:relative;padding:15px 0 15px 34px;
  font-size:16.5px;line-height:1.55;color:var(--ink-soft);
  border-bottom:1px solid var(--hair);
}
ul.pts li:first-child,ol.steps li:first-child{border-top:1px solid var(--hair);}
ul.pts li strong,ol.steps li strong{color:var(--ink);font-weight:500;}
ul.pts li::before{
  content:'';position:absolute;left:6px;top:23px;width:7px;height:7px;
  border-radius:50%;background:var(--accent-tint);border:1px solid var(--accent);
}
ol.steps{counter-reset:s;}
ol.steps li::before{
  counter-increment:s;content:counter(s);position:absolute;left:0;top:14px;
  font-family:var(--font-display);font-size:19px;color:var(--accent);
  width:22px;text-align:left;
}

figure.fig{margin-top:44px;}
figure.fig img{
  display:block;width:100%;height:auto;border-radius:4px;
  box-shadow:var(--sh-card);background:var(--paper-warm);
}
figcaption{
  margin-top:14px;font-size:12px;line-height:1.5;color:var(--ink-mute);
  display:flex;flex-wrap:wrap;gap:5px 8px;align-items:baseline;
}
figcaption .tag{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent-tint);border-radius:20px;padding:3px 9px;white-space:nowrap;
}
figcaption em{font-style:italic;color:var(--ink-mute);}
figure.fig img{cursor:zoom-in;transition:box-shadow .3s var(--ease);}
figure.fig img:hover{box-shadow:0 18px 40px -22px rgba(26,25,23,.5);}

.lb{
  position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:clamp(20px,4vw,56px);
  background:rgba(20,18,16,.86);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility .28s var(--ease);
  cursor:zoom-out;
}
.lb.open{opacity:1;visibility:visible;}
.lb img{
  max-width:min(1400px,94vw);max-height:82vh;width:auto;height:auto;
  border-radius:6px;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);
  background:var(--paper-warm);cursor:default;
  transform:scale(.985);transition:transform .28s var(--ease);
}
.lb.open img{transform:scale(1);}
.lb .lb-cap{
  max-width:min(1000px,90vw);font-size:12.5px;line-height:1.55;color:rgba(252,251,248,.72);
  text-align:center;letter-spacing:.01em;cursor:default;
}
.lb .lb-close{
  position:absolute;top:clamp(16px,2.5vw,28px);right:clamp(16px,2.5vw,28px);
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(252,251,248,.28);
  background:rgba(252,251,248,.06);color:var(--paper);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s var(--ease),transform .2s var(--ease);
}
.lb .lb-close:hover{background:rgba(252,251,248,.16);transform:scale(1.06);}
.lb .lb-close:focus-visible{outline:2px solid var(--accent-tint);outline-offset:3px;}
.lb .lb-close svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;}
@media (prefers-reduced-motion:reduce){
  .lb,.lb img,.lb .lb-close{transition:none;}
  .lb img{transform:none;}
}

.ph{
  position:relative;width:100%;border-radius:4px;
  background:
    linear-gradient(135deg, rgba(228,221,241,.35), rgba(247,244,238,.6));
  border:1px solid var(--hair);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 30px;gap:14px;overflow:hidden;
}
.ph[data-ratio="wide"]{aspect-ratio:16/9;}
.ph[data-ratio="land"]{aspect-ratio:4/3;}
.ph[data-ratio="tall"]{aspect-ratio:3/4;max-width:440px;margin-inline:auto;}
.ph::after{
  content:'';position:absolute;inset:12px;border:1px dashed rgba(122,107,168,.28);
  border-radius:3px;pointer-events:none;
}
.ph .lab{
  position:relative;z-index:1;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  display:inline-flex;align-items:center;gap:7px;
}
.ph .lab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;}
.ph .desc{
  position:relative;z-index:1;max-width:42ch;
  font-family:var(--font-display);font-size:19px;line-height:1.3;color:var(--ink-soft);
}
.ph .fmt{position:relative;z-index:1;font-size:11px;color:var(--ink-mute);}

.close{
  margin-top:40px;padding-top:30px;border-top:1px solid var(--hair);
  font-family:var(--font-display);font-size:clamp(20px,2.3vw,25px);
  line-height:1.32;color:var(--ink-soft);max-width:32ch;
}

footer.foot{
  margin-top:14vh;padding-top:34px;border-top:1px solid var(--hair);
  display:flex;flex-wrap:wrap;gap:18px 30px;align-items:baseline;justify-content:space-between;
}
footer.foot a{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;color:var(--ink-soft);text-decoration:none;
  border-bottom:1px solid transparent;transition:color .3s,border-color .3s;
}
footer.foot a:hover{color:var(--accent);border-bottom-color:var(--accent);}
footer.foot .note{font-size:11.5px;color:var(--ink-mute);max-width:52ch;line-height:1.5;}

.reveal{opacity:0;transform:translateY(16px);
  transition:opacity .7s var(--settle),transform .7s var(--settle);}
.reveal.in{opacity:1;transform:none;}

@media (max-width:980px){
  :root{--side-w:0px;}
  .side{
    position:sticky;top:0;flex-direction:row;align-items:center;justify-content:space-between;
    width:100%;height:auto;padding:16px 20px;gap:16px;
    border-right:0;border-bottom:1px solid var(--hair);
    background:rgba(247,244,238,.9);backdrop-filter:saturate(1.2) blur(8px);z-index:40;
  }
  .side .mark,.toc{display:none;}
  .main{margin-left:0;padding:0 24px 12vh;}
  header.head{padding:8vh 0 0;}
  #lang{top:11px;right:70px;box-shadow:none;background:transparent;}
  #lang::before{background:var(--accent);}
}
@media (max-width:560px){
  .meta{gap:22px 30px;}
  #lang{right:16px;top:auto;bottom:16px;position:fixed;background:var(--paper);box-shadow:var(--sh-rest);}
  .side{justify-content:flex-start;}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  .reveal{opacity:1;transform:none;transition:none;}
  *{transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<div id="progress" aria-hidden="true"></div>

<aside class="side">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span>All projects</span>
  </a>
  <div class="mark">
    <div class="nm" data-t="wordmark">Between the lines</div>
    <div class="sub" data-t="markSub">Product design case study</div>
  </div>

</aside>

<div id="lang" role="group" data-l="en">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="no" aria-pressed="false">NO</button>
</div>

<main class="main">
  <div class="col">
    <header class="head reveal">
      <div class="kicker" data-t="kicker">Product · Self-initiated</div>
      <h1 class="title" data-t="title">Between the lines</h1>
      <p class="dek" data-t="dek"></p>
      <div class="meta" id="meta"></div>
    </header>

  <div id="hero"></div>

  <article id="article"></article>

  <div class="col">
    <footer class="foot reveal">
      <a href="index.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        <span data-t="footBack">Back to all projects</span>

</main>

<div class="lb" id="lightbox" role="dialog" aria-modal="true" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>

<script>
/* =========================================================
   CONTENT MODEL — a self-initiated product, real build.

   INTEGRITY: I designed and built this journal end to end
   (design + code) as a working, clickable demo. No real users
   yet, so outcomes are qualitative and any insight examples
   are illustrative. Non-clinical by design: every reflection
   is framed as "patterns in your own words", never a diagnosis.

   LANGUAGE: English is the finished copy. The Norwegian draft
   is deferred to the end of the project; until it is written,
   NO mirrors EN so the toggle never breaks (T.no = T.en, and
   the render helpers fall back to .en for any missing string).
   When NO is authored, give each field its own {en,no} pair.
   ========================================================= */
const T = {
  en:{
    back:'All projects',
    wordmark:'Between the lines',
    markSub:'Product design case study',
    kicker:'Product · Self-initiated',
    title:'Between the lines',
    dek:'A journal that shows you the patterns in your own words.',
    footBack:'Back to all projects',
    footNote:'Self-initiated product, 2026. Designed and built end to end as a working, clickable demo. No real users yet, so outcomes are qualitative and insight examples are illustrative. Non-clinical by design: every reflection is framed as patterns in your own words, never a diagnosis.',
    meta:[
      {k:'Role',        v:'Product designer (design + code)'},
      {k:'Discipline',  v:'UX/UI · Product · Build'},
      {k:'Context',     v:'Self-initiated · shipped demo'},
      {k:'Year',        v:'2026'},
      {k:'Scope',       v:'Designed & built end to end'}
    ]
  }
};
/* NO deferred (see header note): mirror EN until the Norwegian draft is written. */
T.no = T.en;

const ASSETS = {
  hero:{ type:'ph', ratio:'wide', wide:true,
    desc:{en:'The app open on a phone, the Between the Lines card visible with a calm mood-and-energy trend curve. Warm paper palette, dusty-lilac accent.'},
    fmt:{en:'Product shot · in progress'} },

  context:{ type:'ph', ratio:'wide',
    desc:{en:'The app running on desktop and phone side by side, a real, usable build rather than a static mockup.'},
    fmt:{en:'Context shot · in progress'} },

  extremes:{ type:'ph', ratio:'wide',
    desc:{en:'Two extremes side by side: an intimidating empty editor, and a row of mood emojis, with the gap between them labelled.'},
    fmt:{en:'Comparison · in progress'} },

  v1:{ type:'ph', ratio:'land',
    desc:{en:'The original single screen with writing, rating and tagging crammed together. Labelled “v1, un-designed.”'},
    fmt:{en:'Before state · in progress'} },

  home:{ type:'ph', ratio:'land',
    desc:{en:'The clean Journal home: the entry list, the insight card, and one primary “New entry” button.'},
    fmt:{en:'Screenshot · in progress'} },

  twostep:{ type:'ph', ratio:'wide',
    desc:{en:'The two-step flow: a distraction-free editor first, then the reflect step appearing afterwards.'},
    fmt:{en:'Interaction demo · in progress'} },

  affect:{ type:'ph', ratio:'land',
    desc:{en:'The Affect Grid with a dot placed and the live “Good · Steady” read-out, with callouts on the two axes.'},
    fmt:{en:'Component closeup · in progress'} },

  evidence:{ type:'ph', ratio:'wide',
    desc:{en:'The evidence base drawn plainly: circumplex model of affect, expressive writing, CBT prompts. “Grounded, not gimmicky.”'},
    fmt:{en:'Principle strip · in progress'} },

  voice:{ type:'ph', ratio:'land',
    desc:{en:'Left: the browser speech API, Chrome only. Right: record then transcribe with Whisper, working across browsers and mobile.'},
    fmt:{en:'Before / after · in progress'} },

  card:{ type:'ph', ratio:'land',
    desc:{en:'The Between the Lines card: the on-device conclusion, the trend chart, a “Reflect deeper” button, and the honest privacy microcopy.'},
    fmt:{en:'Screenshot · in progress'} },

  trend:{ type:'ph', ratio:'land',
    desc:{en:'The mood and energy trend chart, two smooth curves running through the week.'},
    fmt:{en:'Component closeup · in progress'} },

  showcase:{ type:'ph', ratio:'wide',
    desc:{en:'A polished set of the core screens: the Journal, the two-step entry, the Affect Grid, and the insight card.'},
    fmt:{en:'Showcase · in progress'} },

  roadmap:{ type:'ph', ratio:'wide',
    desc:{en:'A calm forward frame: real users, a proper database, and longitudinal language insight as the next horizon.'},
    fmt:{en:'Roadmap sketch · in progress'} }
};

const SECTIONS = [
  {
    id:'itch', nav:{en:'The itch'},
    eyebrow:{en:'01 · Origin'},
    h:{en:'I wanted self-knowledge, so I designed the tool instead of downloading one'},
    body:{en:['I journal to understand myself, and every app I tried sat at one of two extremes. So I built my own, end to end, design and code, as a working demo for this portfolio. It had to be genuinely calm to write in, and honest about what it could and could not tell me.']},
    assets:['context']
  },
  {
    id:'extremes', nav:{en:'Two extremes'},
    eyebrow:{en:'02 · The problem'},
    h:{en:'Journaling apps are either an empty text box or a mood-emoji tracker'},
    body:{en:['The blank page gives you nowhere to start. The mood tracker reduces a whole day to one tapped face and never tells you anything back. Neither closes the loop between writing and understanding, which is the entire reason to keep a journal.']},
    assets:['extremes']
  },
  {
    id:'mirror', nav:{en:'My own v1'},
    eyebrow:{en:'03 · The mirror'},
    h:{en:'My own first version made the same mistake'},
    body:{en:['The first build worked but had never been designed. The writing screen asked you to write, rate your mood and pick tags all at once, so nothing felt focused, and there was no payoff to reward the effort. I was looking at the exact problem I set out to solve.']},
    assets:['v1']
  },
  {
    id:'cut', nav:{en:'One home'},
    eyebrow:{en:'04 · The cut'},
    h:{en:'One home, one task: I cut the navigation and the clutter'},
    body:{en:['There is one thing to do here, write an entry, so I removed the bottom navigation entirely. The Journal is the only home. Nothing floats over the writing surface, and the only overlay in the whole product is the delete confirmation.']},
    assets:['home'],
    sub:{
      h:{en:'What I scoped out'},
      list:{

/* =========================================================
   RENDER  (helpers fall back to .en for any missing NO string)
   ========================================================= */
const article = document.getElementById('article');
const tocOl   = document.getElementById('toc');
const langEl  = document.getElementById('lang');
const LANG_KEY = 'wiola-board:lang';

function pick(o, L){ return o ? (o[L] !== undefined ? o[L] : o.en) : undefined; }

function assetHTML(id, L){
  const a = ASSETS[id]; if(!a) return '';
  const wideCls = a.wide ? ' wide' : '';
  if(a.type === 'img'){
    const cap = pick(a.cap, L) || '';
    return `<figure class="fig reveal${wideCls}">
      <img src="${a.src}" alt="${cap.replace(/"/g,'&quot;')}" loading="lazy">
      <figcaption><span>${cap}</span></figcaption>
    </figure>`;
  }
  const clock = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';
  const tag = L==='no' ? 'Grafikk underveis' : 'Graphic in progress';
  return `<figure class="fig reveal${wideCls}">
    <div class="ph" data-ratio="${a.ratio}">
      <span class="lab">${clock}${tag}</span>
      <span class="desc">${pick(a.desc, L)}</span>
      <span class="fmt">${pick(a.fmt, L)}</span>
    </div>
  </figure>`;
}

function listHTML(list, L){
  const tag = list.type === 'ol' ? 'ol' : 'ul';
  const cls = list.type === 'ol' ? 'steps' : 'pts';
  const items = pick(list, L).map(i=>`<li>${i}</li>`).join('');
  return `<${tag} class="${cls}">${items}</${tag}>`;
}

function render(L){
  const t = T[L] || T.en;

  document.querySelectorAll('[data-t]').forEach(el=>{
    const k = el.dataset.t; if(t[k] !== undefined) el.innerHTML = t[k];
  });
  document.querySelector('.back span').textContent = t.back;

  document.getElementById('meta').innerHTML = t.meta.map(m=>
    `<div class="m"><span class="k">${m.k}</span><span class="v">${m.v}</span></div>`).join('');

  document.getElementById('hero').innerHTML = assetHTML('hero', L);

  article.innerHTML = SECTIONS.map(s=>{
    let inner = `<div class="col">
      <div class="eyebrow">${pick(s.eyebrow, L).replace(/(\d+)/,'<b>$1</b>')}</div>
      <h2 class="h">${pick(s.h, L)}</h2>`;
    if(s.body)  inner += pick(s.body, L).map(p=>`<p>${p}</p>`).join('');
    if(s.list)  inner += listHTML(s.list, L);
    if(s.body2) inner += pick(s.body2, L).map(p=>`<p>${p}</p>`).join('');
    inner += `</div>`;
    if(s.assets) inner += s.assets.map(id=>assetHTML(id, L)).join('');
    if(s.sub){
      inner += `<div class="col"><h3 class="sh">${pick(s.sub.h, L)}</h3>`;
      if(s.sub.body) inner += pick(s.sub.body, L).map(p=>`<p>${p}</p>`).join('');
      if(s.sub.list) inner += listHTML(s.sub.list, L);
      inner += `</div>`;
      if(s.sub.assets) inner += s.sub.assets.map(id=>assetHTML(id, L)).join('');
    }
    if(s.close) inner += `<div class="col"><p class="close">${pick(s.close, L)}</p></div>`;
    return `<section class="sec" id="${s.id}">${inner}</section>`;
  }).join('');

  tocOl.innerHTML = SECTIONS.map((s,i)=>
    `<li><a href="#${s.id}" data-to="${s.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${pick(s.nav, L)}</span></a></li>`
  ).join('');

  document.documentElement.lang = L;
  langEl.dataset.l = L;
  langEl.querySelectorAll('button').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.lang===L)));

  setupReveal();
  setupSpy();
  try{ localStorage.setItem(LANG_KEY, L); }catch(e){}
}

let revealObs;
function setupReveal(){
  if(revealObs) revealObs.disconnect();
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const els = document.querySelectorAll('.reveal');
  if(reduce){ els.forEach(e=>e.classList.add('in')); return; }
  revealObs = new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); revealObs.unobserve(e.target); } });
  }, {rootMargin:'0px 0px -12% 0px', threshold:.08});
  els.forEach(e=>{
    const r = e.getBoundingClientRect();
    if(r.top < innerHeight*0.9) e.classList.add('in'); else revealObs.observe(e);
  });
}

let spyObs;
function setupSpy(){
  if(spyObs) spyObs.disconnect();
  const links = new Map([...tocOl.querySelectorAll('a')].map(a=>[a.dataset.to, a]));
  const secs = [...document.querySelectorAll('section.sec')];
  spyObs = new IntersectionObserver((ents)=>{
    ents.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(a=>a.classList.remove('on'));
        const a = links.get(e.target.id); if(a) a.classList.add('on');
      }
    });
  }, {rootMargin:'-45% 0px -50% 0px', threshold:0});
  secs.forEach(s=> spyObs.observe(s));
}

const bar = document.getElementById('progress');
addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const p = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
  bar.style.transform = `scaleX(${Math.min(Math.max(p,0),1)})`;
}, {passive:true});

langEl.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang === langEl.dataset.l) return;
  render(b.dataset.lang);
});

(function(){
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCap = document.getElementById('lbCap');
  const lbClose = document.getElementById('lbClose');
  const CLOSE_LABEL = {en:'Close', no:'Lukk'};
  let lastFocus = null, hideTimer = null;

  function open(img){
    const fig = img.closest('figure.fig');
    const cap = fig ? fig.querySelector('figcaption') : null;
    lbImg.src = img.currentSrc || img.src;
    lbImg.alt = img.alt || '';
    lbCap.textContent = cap ? cap.textContent.trim() : (img.alt || '');
    lbClose.setAttribute('aria-label', CLOSE_LABEL[document.documentElement.lang] || 'Close');
    lastFocus = document.activeElement;
    clearTimeout(hideTimer);
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
    void lb.offsetWidth;
    lb.classList.add('open');
    lbClose.focus();
  }
  function close(){
    if(!lb.classList.contains('open')) return;
    lb.classList.remove('open');
    document.body.style.overflow = '';
    hideTimer = setTimeout(()=>{ lb.hidden = true; lbImg.removeAttribute('src'); }, 300);
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.addEventListener('click', e=>{
    const img = e.target.closest('figure.fig img');
    if(img){ open(img); }
  });
  lb.addEventListener('click', e=>{ if(e.target !== lbImg) close(); });
  lbClose.addEventListener('click', close);
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') close(); });
})();

let lang = 'en';
try{ lang = localStorage.getItem(LANG_KEY) || 'en'; }catch(e){}
render(lang);
</script>
